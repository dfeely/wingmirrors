<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Car wing mirror reflecting green hills and a country road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc7ea"/>
      <stop offset="0.65" stop-color="#d6ecf8"/>
      <stop offset="1" stop-color="#eef8fc"/>
    </linearGradient>
    <linearGradient id="glassSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dbbe3"/>
      <stop offset="1" stop-color="#e3f3fb"/>
    </linearGradient>
    <linearGradient id="housing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4856"/>
      <stop offset="1" stop-color="#171e26"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e5f8f"/>
      <stop offset="1" stop-color="#0b3d63"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="glassClip">
      <rect x="470" y="150" width="400" height="330" rx="150" ry="140"/>
    </clipPath>
  </defs>

  <!-- background sky and scenery -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="210" cy="130" r="58" fill="#fff6cf" opacity="0.95"/>
  <circle cx="210" cy="130" r="92" fill="#fff6cf" opacity="0.25"/>
  <g fill="#fff" opacity="0.85">
    <ellipse cx="420" cy="110" rx="70" ry="20"/><ellipse cx="465" cy="98" rx="46" ry="18"/>
    <ellipse cx="980" cy="90" rx="80" ry="22"/><ellipse cx="1030" cy="76" rx="50" ry="18"/>
  </g>
  <path d="M0 420 C150 350 280 380 420 400 C560 420 640 340 800 350 C940 360 1060 410 1200 380 L1200 630 L0 630Z" fill="#8cc77a"/>
  <path d="M0 470 C180 420 340 470 520 450 C700 430 860 480 1200 440 L1200 630 L0 630Z" fill="#5fa85a"/>
  <path d="M0 540 C260 510 520 560 760 540 C960 524 1100 550 1200 540 L1200 630 L0 630Z" fill="#3f8a45"/>
  <g fill="#2f6f3a"><rect x="108" y="408" width="10" height="42"/><circle cx="113" cy="396" r="34"/>
  <rect x="236" y="430" width="8" height="30"/><circle cx="240" cy="420" r="24"/></g>

  <!-- door panel and arm -->
  <rect x="1010" y="0" width="190" height="630" fill="url(#door)"/>
  <path d="M1010 0 L1010 630" stroke="#06293f" stroke-width="6"/>
  <path d="M1010 120 H1200" stroke="#06293f" stroke-width="4" opacity="0.6"/>
  <rect x="860" y="285" width="170" height="44" rx="22" fill="#222b34"/>
  <rect x="860" y="285" width="170" height="14" rx="7" fill="#4a5968" opacity="0.7"/>

  <!-- mirror housing -->
  <rect x="440" y="120" width="460" height="390" rx="175" ry="160" fill="url(#housing)"/>
  <rect x="446" y="126" width="448" height="378" rx="170" ry="155" fill="none" stroke="#5c6b7a" stroke-width="3" opacity="0.7"/>

  <!-- glass with reflection -->
  <g clip-path="url(#glassClip)">
    <rect x="470" y="150" width="400" height="330" fill="url(#glassSky)"/>
    <circle cx="560" cy="215" r="26" fill="#fff6cf"/>
    <ellipse cx="740" cy="200" rx="52" ry="14" fill="#fff" opacity="0.9"/>
    <path d="M470 345 C560 300 640 330 720 320 C790 312 830 300 870 310 L870 480 L470 480Z" fill="#8cc77a"/>
    <path d="M470 385 C580 355 660 395 760 380 C820 372 850 372 870 376 L870 480 L470 480Z" fill="#5fa85a"/>
    <path d="M610 480 C650 430 700 400 760 380 L800 382 C760 410 730 440 720 480Z" fill="#5d6772"/>
    <path d="M668 480 C690 440 724 418 765 400" stroke="#f4f4f4" stroke-width="3" stroke-dasharray="14 12" fill="none"/>
    <path d="M470 150 L700 150 L470 400Z" fill="url(#shine)"/>
  </g>
  <rect x="470" y="150" width="400" height="330" rx="150" ry="140" fill="none" stroke="#0e1319" stroke-width="5"/>

  <!-- indicator repeater -->
  <path d="M868 238 C876 262 876 330 868 352" stroke="#ffb020" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
